[project]
name = "create-reso-world"
version = "0.0.0"
description = "Dev Container environment for building Resonite worlds with resoloop and Blender"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests/skills", ".agents/skills", ".agents/scripts", "tools"]
# importlib: 移植した runner のテストは同じ名前のテストのファイルを別のディレクトリに持つ（#149 の Spec の C-1）。
addopts = "-p no:cacheprovider --import-mode=importlib"
pythonpath = ["."]

[tool.uv]
package = false
