# 汎用の非対話エージェント実行ツール。資格情報の値は書かない。
# agent 名の規則: .devcontainer/README.md「agent の命名と同一モデルの比較」を参照。
# 個人設定 ~/.config/agent-runner/config.toml はこの雛形に重ねて読む。install_beforehand.bash は、個人設定が無いときに
# agent-runner-personal.toml を置き、この雛形は写さない。
schema_version = 1

[agents.claude-code_opus_xhigh]
runtime = "claude-code"
command = ["claude"]
model = "opus"
effort = "xhigh"
env = ["HOME", "PATH"]

# Devin の SWE-2 は tier（medium・high・max）を --model の UID で選ぶ。tier は effort の軸なので名の effort の段に置く。
# 2 つは同じ model_key で同じモデルとして扱う（同じ役割に並べられない）。
[agents.devin_swe2_max]
runtime = "devin"
command = ["devin"]
model = "swe-2-max"
model_key = "swe-2"
env = ["HOME", "PATH"]

[agents.devin_swe2_medium]
runtime = "devin"
command = ["devin"]
model = "swe-2-medium"
model_key = "swe-2"
env = ["HOME", "PATH"]

[agents.pi_commandcode_deepseek4-flash_max]
runtime = "pi"
command = ["piccd"]
model = "deepseek/deepseek-v4.1-flash"
model_key = "deepseek-v4.1-flash"
provider = "commandcode"
effort = "max"
env = ["HOME", "PATH", "COMMANDCODE_API_KEY"]

[agents.pi_openai-codex_gpt6-sol_xhigh]
runtime = "pi"
command = ["pigs"]
model = "gpt-6.1-sol"
provider = "openai-codex"
effort = "xhigh"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pi_xai_grok4_xhigh]
runtime = "pi"
command = ["pixg"]
model = "grok-4.7"
provider = "xai"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.pi_opencode-go_glm5-flash_max]
runtime = "pi"
command = ["pi"]
model = "glm-5.3-flash"
provider = "opencode-go"
effort = "max"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pi_opencode-go_deepseek4-flash_max]
runtime = "pi"
command = ["pigod"]
model = "deepseek-v4.1-flash"
model_key = "deepseek-v4.1-flash"
provider = "opencode-go"
effort = "max"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pi_google-vertex_gemini3-flash_high]
runtime = "pi"
command = ["pigemf"]
model = "gemini-3.8-flash"
provider = "google-vertex"
effort = "high"
env = ["HOME", "PATH", "GOOGLE_APPLICATION_CREDENTIALS", "GOOGLE_CLOUD_PROJECT", "GCLOUD_PROJECT", "GOOGLE_CLOUD_LOCATION"]

[agents.pi_openai-codex_gpt6-terra_xhigh]
runtime = "pi"
command = ["pigt"]
model = "gpt-6.1-terra"
provider = "openai-codex"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.pi_openai-codex_gpt6-astra_xhigh]
runtime = "pi"
command = ["piga"]
model = "gpt-6-astra"
provider = "openai-codex"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.claude-code_sonnet_xhigh]
runtime = "claude-code"
command = ["claude"]
model = "sonnet"
effort = "xhigh"
env = ["HOME", "PATH"]

# claude-ollama-exec（.devcontainer/claude-ollama-exec。Rebuild で ~/.local/bin に配置）で
# Ollama Cloud（https://ollama.com）につなぐ。モデルの対応は zshrc.txt の ccdol と揃える
# （4 つの tier すべて deepseek-v4.1-flash:1017[1m]）。
# OLLAMA_API_KEY はファイルに書かず、通常のシェルでは export して使う。ccdol のセッションから
# with_keys.py 経由で runner を起動する場合は、ANTHROPIC_BASE_URL の一致で ANTHROPIC_AUTH_TOKEN から
# OLLAMA_API_KEY が補われる。それ以外のランチャーのセッションや with_keys.py を通さない直接起動では
# key が届かず、claude-ollama-exec の key ガードで終了コード 1 で止まる。
# 同一モデル比較（duplicate_model）: model_key = "deepseek-v4.1-flash" により、既存の DeepSeek V4.1 Flash
# 系 3 agent（pi_commandcode_deepseek4-flash_max・pi_opencode-go_deepseek4-flash_max・
# pi_deepinfra_deepseek4-flash_high）および Ollama の 2 agent 同士は同じ役割に並べられない。加えて
# opus 側は claude-code_opus_xhigh・claude-code_alibaba_opus_max と、sonnet 側は
# claude-code_sonnet_xhigh と model が一致するため同じ役割に並べられない。将来 tier ごとに別モデルへ
# 変えた場合は model_key も別値にすること。
[agents.claude-code_ollama_opus_max]
runtime = "claude-code"
command = ["claude-ollama-exec"]
model = "opus"
model_key = "deepseek-v4.1-flash"
provider = "ollama"
effort = "max"
env = ["HOME", "PATH", "OLLAMA_API_KEY"]

[agents.claude-code_ollama_sonnet_max]
runtime = "claude-code"
command = ["claude-ollama-exec"]
model = "sonnet"
model_key = "deepseek-v4.1-flash"
provider = "ollama"
effort = "max"
env = ["HOME", "PATH", "OLLAMA_API_KEY"]

# claude-alibaba-exec（.devcontainer/claude-alibaba-exec）で Alibaba Cloud Model Studio の
# Token Plan につなぐ。モデルの対応は zshrc.txt の ccda と揃える（fable・opus は
# qwen4-max-preview、sonnet・haiku も qwen4-max-preview）。model が opus なので
# claude-code_opus_xhigh と同じ役割に並べられない。
# ccda のセッションから with_keys.py 経由で runner を起動する場合は、ANTHROPIC_BASE_URL の一致で
# ANTHROPIC_AUTH_TOKEN から MAAS_ANTHROPIC_TOKEN が補われる。それ以外のランチャー（ccdd・ccddg・
# ccdgo・ccdol）のセッションや with_keys.py を通さない直接起動では key が届かず、
# claude-alibaba-exec の key ガードで終了コード 1 で止まる。
[agents.claude-code_alibaba_opus_max]
runtime = "claude-code"
command = ["claude-alibaba-exec"]
model = "opus"
model_key = "qwen4-max-preview"
provider = "alibaba"
effort = "max"
env = ["HOME", "PATH", "MAAS_ANTHROPIC_TOKEN"]

# piaq（.devcontainer/piaq。Rebuild で ~/.local/bin に配置）で Alibaba Cloud Model Studio の
# Token Plan の qwen4-max-preview につなぐ。key は MAAS_ANTHROPIC_TOKEN。ファイルには書かない。
# 通常のシェルでは key を export して使う。
# 子に渡るのは env の allowlist に挙げた変数だけで、zshrc.txt は読まれない。runner を起動した
# シェルに key が無ければ、allowlist に挙げても子には届かない。
# ccd 系のランチャー（ccdd・ccddg・ccdgo・ccdol・ccda）は、cc_launcher_unsets の env -u で
# 自分の子から MAAS_ANTHROPIC_TOKEN を外す（ccda は子に ANTHROPIC_AUTH_TOKEN として渡し直す）。
# シェル全体から unset する仕組みは無く、本リポジトリでは env ファイルからも補わない。
# ccda のセッションから with_keys.py 経由で runner を起動する場合は、ANTHROPIC_BASE_URL の一致で
# ANTHROPIC_AUTH_TOKEN から MAAS_ANTHROPIC_TOKEN が補われる。それ以外のランチャー（ccdd・ccddg・
# ccdgo・ccdol）のセッションや with_keys.py を通さない直接起動では key が届かず、piaq は key の
# 案内を出して終了コード 1 で止まり、Pi を起動しない。
# model の qwen4-max-preview は #401 の claude-code_alibaba_opus_max の model_key と同じなので、
# 2 つは同じモデルとして扱われ、同じ役割に並べられない。
[agents.pi_alibaba_qwen4-max_max]
runtime = "pi"
command = ["piaq"]
model = "qwen4-max-preview"
provider = "alibaba"
effort = "max"
env = ["HOME", "PATH", "MAAS_ANTHROPIC_TOKEN"]

[agents.pi_google-vertex_gemini4-argon_high]
runtime = "pi"
command = ["pigema"]
model = "gemini-4-argon"
provider = "google-vertex"
effort = "high"
env = ["HOME", "PATH", "GOOGLE_APPLICATION_CREDENTIALS", "GOOGLE_CLOUD_PROJECT", "GCLOUD_PROJECT", "GOOGLE_CLOUD_LOCATION"]

[agents.pi_deepinfra_deepseek4-flash_high]
runtime = "pi"
command = ["pidid"]
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017"
model_key = "deepseek-v4.1-flash"
provider = "deepinfra"
effort = "high"
env = ["HOME", "PATH", "DEEPINFRA_TOKEN"]

# codex exec --json。実測既定モデルは gpt-6.1-sol（openai）。
[agents.codex_openai_gpt6-sol_default]
runtime = "codex"
command = ["codex", "exec"]
model = "gpt-6.1-sol"
provider = "openai"
approval = "noninteractive"
skill_sources = [".agents/skills", ".codex/skills"]
env = ["HOME", "PATH"]

# Cursor Agent（agent/cursor-agent は同一バイナリへの symlink）。model は slug、auto は実測の既定。
[agents.cursor_auto_default]
runtime = "cursor"
command = ["agent"]
model = "auto"
approval = "noninteractive"
skill_sources = [".cursor/skills", ".claude/skills", ".agents/skills", ".codex/skills"]
env = ["HOME", "PATH"]

# Grok-4.7 を Cursor CLI 側で明示する agent。grok-4.7-xhigh は --list-models の実在 slug。
[agents.cursor_grok4_xhigh]
runtime = "cursor"
command = ["agent"]
model = "grok-4.7-xhigh"
approval = "noninteractive"
skill_sources = [".cursor/skills", ".claude/skills", ".agents/skills", ".codex/skills"]
env = ["HOME", "PATH"]

# 役割の期限（usaturn/agent-workspace#616）。pr-review の全体予算に合わせて 45 分とし、implement だけ 90 分にする。
# fix-check は呼び出し側（review-verify の dispatch.py・review-fix-planning の run_roles.py）が 1800 秒に切り詰める。
[roles.inspect]
skills = []
writes = false
deadline_seconds = 2700
result_shape = "json"

[roles.implement]
skills = []
writes = true
deadline_seconds = 5400
result_shape = "json"

[roles.self-review]
skills = []
writes = false
deadline_seconds = 2700
result_shape = "json"

[roles.fix-check]
skills = []
writes = false
deadline_seconds = 2700
result_shape = "json"

# issue-to-pr の `--spec-review AGENT` を書いた run だけ、Spec を保存した後・Plan の前に Spec をレビューする役割（usaturn/agent-workspace#848・#853）。ファイルを書かない。
# 担当は引数で決まり、雛形に割り当ては置かない（個人設定に fallback を書くときは同じ節に agents も書く。agents は引数で置き換わる）。
# xhigh の reviewer が既存のコードを確かめながら読む時間を見て 30 分とする（期限切れは issue-to-pr の run の停止になる）。
[roles.spec-review]
skills = []
writes = false
deadline_seconds = 1800
result_shape = "json"

# issue-to-pr の `--design-review AGENT` を書いた run だけ、Spec を保存した後・Spec レビューと Plan の前に、設計の妥当性と別案をレビューする役割（usaturn/agent-workspace#861）。ファイルを書かない。
# 担当は引数で決まり、雛形に割り当ては置かない（個人設定に fallback を書くときは同じ節に agents も書く。agents は引数で置き換わる）。
# 期限は Spec レビューと同じ 30 分とする（期限切れは issue-to-pr の run の停止になる）。
[roles.design-review]
skills = []
writes = false
deadline_seconds = 1800
result_shape = "json"

# PR レビューの後処理。ランナーの観測値を実行記録へ追記する。
[workflows.review]
after_run = [[
  "uv", "run", "--project", ".", "--locked", "python",
  ".agents/skills/pr-review/scripts/review_run.py", "attach-runner", "--result", "{result}",
]]

# workflow の割り当て既定値（usaturn/agent-workspace#565）。
# review の inspect（レビュアー）は固定しない。依頼ごとに --assign inspect=agent-a,agent-b で選ぶ。
# いつも使う構成は、個人設定のこの節の agents を書き換える。
# 下の 3 人は指定が無いときの既定値で、性能の順位ではない。
# Command Code GOAT は契約終了のため既定から外す（#337）。
[workflows.review.assignments.inspect]
agents = ["claude-code_opus_xhigh", "devin_swe2_max", "pi_opencode-go_deepseek4-flash_max"]

# review-fix-planning の run_roles.py が使う担当（usaturn/agent-workspace#116 のボードの D-13）。self は司令塔が自分で実行する。
# self-review・fix-check には codex の担当を割り当てられない（run_roles.py が起動の前に拒否する）。
[workflows.fix.assignments.implement]
agents = ["self"]

[workflows.fix.assignments.self-review]
agents = ["self"]

[workflows.fix.assignments.fix-check]
agents = ["self"]

# issue-to-pr が Plan の Task を 1 つずつ実装させる担当（usaturn/agent-workspace#679）。レビュー修正の fix.implement とは別に選ぶ。
# 既定は self。issue-to-pr を実行しているセッション（司令塔）が自分で実装し、runner を起動しない。
# 外部の担当に任せるときは、個人設定のこの節の agents を書き換え、代わりの候補を fallback に明示する。
# その回だけ変えるときは /issue-to-pr <Issue> --implement <agent> と書く（fallback は保つ）。
# agents は 1 つだけ。
[workflows.issue.assignments.implement]
agents = ["self"]
