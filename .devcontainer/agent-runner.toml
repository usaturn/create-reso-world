# 非対話のエージェントのランナー（tools/agent_runner）の雛形。資格情報の値は書かない。
# 命名: [agent の命名と同一モデルの比較](README.md#agent-catalog-names)
# 個人設定 ~/.config/agent-runner/config.toml はこの雛形に重ねて読む。install_beforehand.bash は、個人設定が無いときに
# agent-runner-personal.toml を置き、この雛形は写さない。
# 仕様は tools/agent_runner/interfaces.rst。agent の定義（[agents.*]）は adapter と一緒に #150・#151 が、
# workflow の割り当て（[workflows.*]）はそれを使う子（#153・#155・#157）が足す。
schema_version = 1

# 役割の期限（usaturn/agent-workspace#616）。PR レビューの全体の予算に合わせて 45 分とし、implement だけ 90 分にする。
# fix-check は呼び出し側（review-verify・review-fix-planning）が 1800 秒に切り詰める。
[roles.inspect]
skills = []
writes = false
deadline_seconds = 2700
result_shape = "json"

[roles.implement]
skills = []
writes = true
deadline_seconds = 5400
result_shape = "json"

[roles.self-review]
skills = []
writes = false
deadline_seconds = 2700
result_shape = "json"

[roles.fix-check]
skills = []
writes = false
deadline_seconds = 2700
result_shape = "json"

[agents.pi_commandcode_deepseek4-flash_max]
runtime = "pi"
command = ["piccd"]
model = "deepseek/deepseek-v4.1-flash"
model_key = "deepseek-v4.1-flash"
provider = "commandcode"
effort = "max"
env = ["HOME", "PATH", "COMMANDCODE_API_KEY"]

[agents.pi_openai-codex_gpt6-sol_max]
runtime = "pi"
command = ["pigs"]
model = "gpt-6.1-sol"
provider = "openai-codex"
effort = "max"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pi_xai_grok4_xhigh]
runtime = "pi"
command = ["pixg"]
model = "grok-4.7"
provider = "xai"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.pi_opencode-go_deepseek4-flash_max]
runtime = "pi"
command = ["pigod"]
model = "deepseek-v4.1-flash"
model_key = "deepseek-v4.1-flash"
provider = "opencode-go"
effort = "max"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pi_opencode-go_glm5-flash_max]
runtime = "pi"
command = ["pi"]
model = "glm-5.3-flash"
provider = "opencode-go"
effort = "max"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pi_google-vertex_gemini3-flash_high]
runtime = "pi"
command = ["pigemf"]
model = "gemini-3.8-flash"
provider = "google-vertex"
effort = "high"
env = ["HOME", "PATH", "GOOGLE_APPLICATION_CREDENTIALS", "GOOGLE_CLOUD_PROJECT", "GCLOUD_PROJECT", "GOOGLE_CLOUD_LOCATION"]

[agents.claude-code_opus_default]
runtime = "claude-code"
command = ["claude"]
model = "opus"
env = ["HOME", "PATH"]

[agents.codex_openai_gpt6-sol_default]
runtime = "codex"
command = ["codex", "exec"]
model = "gpt-6.1-sol"
provider = "openai"
approval = "noninteractive"
skill_sources = [".agents/skills", ".codex/skills"]
env = ["HOME", "PATH"]

[agents.cursor_auto_default]
runtime = "cursor"
command = ["agent"]
model = "auto"
approval = "noninteractive"
skill_sources = [".cursor/skills", ".claude/skills", ".agents/skills", ".codex/skills"]
env = ["HOME", "PATH"]

[agents.cursor_grok4_xhigh]
runtime = "cursor"
command = ["agent"]
model = "grok-4.7-xhigh"
approval = "noninteractive"
skill_sources = [".cursor/skills", ".claude/skills", ".agents/skills", ".codex/skills"]
env = ["HOME", "PATH"]

# SWE-2 は tier（medium・high・max）を --model の UID で選ぶ。tier は effort の軸なので、agent 名の effort の段に置く。
# 2 つは同じ model_key なので同じモデルとして扱い、同じ役割に並べられない。
[agents.devin_swe2_max]
runtime = "devin"
command = ["devin"]
model = "swe-2-max"
model_key = "swe-2"
env = ["HOME", "PATH"]

[agents.devin_swe2_medium]
runtime = "devin"
command = ["devin"]
model = "swe-2-medium"
model_key = "swe-2"
env = ["HOME", "PATH"]

[agents.pi_openai-codex_gpt6-terra_xhigh]
runtime = "pi"
command = ["pigt"]
model = "gpt-6.1-terra"
provider = "openai-codex"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.pi_openai-codex_gpt6-astra_xhigh]
runtime = "pi"
command = ["piga"]
model = "gpt-6-astra"
provider = "openai-codex"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.claude-code_sonnet_default]
runtime = "claude-code"
command = ["claude"]
model = "sonnet"
env = ["HOME", "PATH"]

[agents.pi_google-vertex_gemini4-argon_high]
runtime = "pi"
command = ["pigema"]
model = "gemini-4-argon"
provider = "google-vertex"
effort = "high"
env = ["HOME", "PATH", "GOOGLE_APPLICATION_CREDENTIALS", "GOOGLE_CLOUD_PROJECT", "GCLOUD_PROJECT", "GOOGLE_CLOUD_LOCATION"]

[agents.pi_deepinfra_deepseek4-flash_high]
runtime = "pi"
command = ["pidid"]
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017"
model_key = "deepseek-v4.1-flash"
provider = "deepinfra"
effort = "high"
env = ["HOME", "PATH", "DEEPINFRA_TOKEN"]

# after_run はレビュー結果に runner の実行記録を付ける。
# 個人設定は書き換えない。after_run = [] で無効にした caller は attach-runner を明示実行する。
[workflows.review]
after_run = [[
  "uv", "run", "--project", ".", "--locked", "python",
  ".agents/skills/pr-review/scripts/review_run.py", "attach-runner", "--result", "{result}",
]]

# 指定が無いときの既定構成。Command Code GOAT は契約終了のため既定から外す（#337）。
# その回の --assign inspect=... または個人設定で選び直せる。
[workflows.review.assignments.inspect]
agents = ["pi_openai-codex_gpt6-sol_max", "devin_swe2_max", "pi_opencode-go_deepseek4-flash_max"]

# review-fix-planning の run_roles.py が使う担当（#116 のボードの D-13）。self は司令塔が自分で実行する。
# self-review・fix-check には codex の担当を割り当てられない（run_roles.py が起動の前に拒否する）。
[workflows.fix.assignments.implement]
agents = ["self"]

[workflows.fix.assignments.self-review]
agents = ["self"]

[workflows.fix.assignments.fix-check]
agents = ["self"]

# issue-to-pr の Plan の Task を実装する担当。既定の self はこのセッションが自分で実装する。
# その回の --implement AGENT か個人設定で選び直せる（担当の fallback は個人設定に書く）。
[workflows.issue.assignments.implement]
agents = ["self"]
