command = ["pixg"]
model = "grok-4.7"
provider = "xai"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.pi_opencode-go_deepseek4-flash_max]
runtime = "pi"
command = ["pigod"]
model = "deepseek-v4.1-flash"
model_key = "deepseek-v4.1-flash"
provider = "opencode-go"
effort = "max"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pi_opencode-go_glm5-flash_max]
runtime = "pi"
command = ["pi"]
model = "glm-5.3-flash"
provider = "opencode-go"
effort = "max"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pi_google-vertex_gemini3-flash_high]
