[agents.cursor_grok4_xhigh]
runtime = "cursor"
command = ["agent"]
model = "grok-4.7-xhigh"
approval = "noninteractive"
skill_sources = [".cursor/skills", ".claude/skills", ".agents/skills", ".codex/skills"]
env = ["HOME", "PATH"]

# SWE-2 は tier（medium・high・max）を --model の UID で選ぶ。tier は effort の軸なので、agent 名の effort の段に置く。
# 2 つは同じ model_key なので同じモデルとして扱い、同じ役割に並べられない。
[agents.devin_swe2_max]
runtime = "devin"
command = ["devin"]
model = "swe-2-max"
model_key = "swe-2"
env = ["HOME", "PATH"]

[agents.devin_swe2_medium]
runtime = "devin"
command = ["devin"]
model = "swe-2-medium"
model_key = "swe-2"
env = ["HOME", "PATH"]

[agents.pi_openai-codex_gpt6-terra_xhigh]
runtime = "pi"
command = ["pigt"]
model = "gpt-6.1-terra"
provider = "openai-codex"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.pi_openai-codex_gpt6-astra_xhigh]
runtime = "pi"
command = ["piga"]
model = "gpt-6-astra"
provider = "openai-codex"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.claude-code_sonnet_xhigh]
runtime = "claude-code"
command = ["claude"]
model = "sonnet"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.pi_google-vertex_gemini4-argon_high]
runtime = "pi"
command = ["pigema"]
model = "gemini-4-argon"
provider = "google-vertex"
effort = "high"
env = ["HOME", "PATH", "GOOGLE_APPLICATION_CREDENTIALS", "GOOGLE_CLOUD_PROJECT", "GCLOUD_PROJECT", "GOOGLE_CLOUD_LOCATION"]

# piaq（.devcontainer/piaq。Rebuild で ~/.local/bin に配置）で Alibaba Cloud Model Studio の
# Token Plan の qwen4-max-preview につなぐ。key は MAAS_ANTHROPIC_TOKEN。ファイルには書かない。
# 通常のシェルでは key を export して使う。
# 子に渡るのは env の allowlist に挙げた変数だけで、zshrc.txt は読まれない。runner を起動した
# シェルに key が無ければ、allowlist に挙げても子には届かない。
# ccd 系のランチャー（ccdd・ccddg・ccdgo・ccdol・ccda）は、cc_launcher_unsets の env -u で
# 自分の子から MAAS_ANTHROPIC_TOKEN を外す（ccda は子に ANTHROPIC_AUTH_TOKEN として渡し直す）。
# シェル全体から unset する仕組みは無く、本リポジトリでは env ファイルからも補わない。
# ccda のセッションから with_keys.py 経由で runner を起動する場合は、ANTHROPIC_BASE_URL の一致で
# ANTHROPIC_AUTH_TOKEN から MAAS_ANTHROPIC_TOKEN が補われる。それ以外のランチャー（ccdd・ccddg・
# ccdgo・ccdol）のセッションや with_keys.py を通さない直接起動では key が届かず、piaq は key の
# 案内を出して終了コード 1 で止まり、Pi を起動しない。
# model の qwen4-max-preview は #401 の claude-code_alibaba_opus_max の model_key と同じなので、
# 2 つは同じモデルとして扱われ、同じ役割に並べられない。
[agents.pi_alibaba_qwen4-max_max]
runtime = "pi"
command = ["piaq"]
model = "qwen4-max-preview"
provider = "alibaba"
effort = "max"
env = ["HOME", "PATH", "MAAS_ANTHROPIC_TOKEN"]

[agents.pi_deepinfra_deepseek4-flash_high]
runtime = "pi"
command = ["pidid"]
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017"
model_key = "deepseek-v4.1-flash"
provider = "deepinfra"
effort = "high"
env = ["HOME", "PATH", "DEEPINFRA_TOKEN"]

# claude-alibaba-exec（.devcontainer/claude-alibaba-exec）で Alibaba Cloud Model Studio の
# Token Plan につなぐ。モデルの対応は zshrc.txt の ccda と揃える（fable・opus は
# qwen4-max-preview、sonnet・haiku も qwen4-max-preview）。model が opus なので
# claude-code_opus_default と同じ役割に並べられない。
# ccda のセッションから with_keys.py 経由で runner を起動する場合は、ANTHROPIC_BASE_URL の一致で
# ANTHROPIC_AUTH_TOKEN から MAAS_ANTHROPIC_TOKEN が補われる。それ以外のランチャー（ccdd・ccddg・
# ccdgo・ccdol）のセッションや with_keys.py を通さない直接起動では key が届かず、
# claude-alibaba-exec の key ガードで終了コード 1 で止まる。
[agents.claude-code_alibaba_opus_max]
runtime = "claude-code"
command = ["claude-alibaba-exec"]
model = "opus"
model_key = "qwen4-max-preview"
provider = "alibaba"
effort = "max"
env = ["HOME", "PATH", "MAAS_ANTHROPIC_TOKEN"]

# claude-ollama-exec（.devcontainer/claude-ollama-exec。Rebuild で ~/.local/bin に配置）で
# Ollama Cloud（https://ollama.com）につなぐ。モデルの対応は zshrc.txt の ccdol と揃える
# （4 つの tier すべて deepseek-v4.1-flash:1017[1m]）。
# OLLAMA_API_KEY はファイルに書かず、通常のシェルでは export して使う。ccdol のセッションから
# with_keys.py 経由で runner を起動する場合は、ANTHROPIC_BASE_URL の一致で ANTHROPIC_AUTH_TOKEN から
# OLLAMA_API_KEY が補われる。それ以外のランチャーのセッションや with_keys.py を通さない直接起動では
# key が届かず、claude-ollama-exec の key ガードで終了コード 1 で止まる。
# 同一モデル比較（duplicate_model）: model_key = "deepseek-v4.1-flash" により、既存の DeepSeek V4.1 Flash
# 系 3 agent（pi_commandcode_deepseek4-flash_max・pi_opencode-go_deepseek4-flash_max・
# pi_deepinfra_deepseek4-flash_high）および Ollama の 2 agent 同士は同じ役割に並べられない。加えて
# opus 側は claude-code_opus_default・claude-code_alibaba_opus_max と、sonnet 側は
# claude-code_sonnet_xhigh と model が一致するため同じ役割に並べられない。将来 tier ごとに別モデルへ
# 変えた場合は model_key も別値にすること。
[agents.claude-code_ollama_opus_max]
runtime = "claude-code"
command = ["claude-ollama-exec"]
model = "opus"
model_key = "deepseek-v4.1-flash"
provider = "ollama"
effort = "max"
env = ["HOME", "PATH", "OLLAMA_API_KEY"]

[agents.claude-code_ollama_sonnet_max]
runtime = "claude-code"
command = ["claude-ollama-exec"]
model = "sonnet"
model_key = "deepseek-v4.1-flash"
provider = "ollama"
effort = "max"
env = ["HOME", "PATH", "OLLAMA_API_KEY"]

# after_run はレビュー結果に runner の実行記録を付ける。
# 個人設定は書き換えない。after_run = [] で無効にした caller は attach-runner を明示実行する。
[workflows.review]
after_run = [[
  "uv", "run", "--project", ".", "--locked", "python",
  ".agents/skills/pr-review/scripts/review_run.py", "attach-runner", "--result", "{result}",
]]

# 指定が無いときの既定構成。Command Code GOAT は契約終了のため既定から外す（#337）。
# その回の --assign inspect=... または個人設定で選び直せる。
[workflows.review.assignments.inspect]
agents = ["claude-code_opus_default", "devin_swe2_max", "pi_opencode-go_deepseek4-flash_max"]

# review-fix-planning の run_roles.py が使う担当（#116 のボードの D-13）。self は司令塔が自分で実行する。
# self-review・fix-check には codex の担当を割り当てられない（run_roles.py が起動の前に拒否する）。
[workflows.fix.assignments.implement]
agents = ["self"]

[workflows.fix.assignments.self-review]
agents = ["self"]

[workflows.fix.assignments.fix-check]
agents = ["self"]

# issue-to-pr の Plan の Task を実装する担当。雛形の既定は self で、司令塔が自分で実装する。
# その回の --implement AGENT か個人設定で選び直せる（担当の fallback は個人設定に書く）。
# --implement は agents を置き換え、fallback を保つ。
[workflows.issue.assignments.implement]
agents = ["self"]
