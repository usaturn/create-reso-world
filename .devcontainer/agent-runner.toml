# 非対話のエージェントのランナー（tools/agent_runner）の雛形。資格情報の値は書かない。
# install_beforehand.bash が、個人設定 ~/.config/agent-runner/config.toml が無いときだけ写す。
# 仕様は tools/agent_runner/interfaces.rst。agent の定義（[agents.*]）は adapter と一緒に #150・#151 が、
# workflow の割り当て（[workflows.*]）はそれを使う子（#153・#155・#157）が足す。
schema_version = 1

# DSH 標準 headless。共有 profile と追加プラグインは読み込まない。
[agents.dsh-ccd]
runtime = "dsh"
command = ["dsh"]
model = "deepseek/deepseek-v4.1-flash"
provider = "commandcode"
effort = "max"
env = ["PATH", "COMMANDCODE_API_KEY"]

[agents.dsh-go]
runtime = "dsh"
command = ["dsh"]
model = "deepseek-v4.1-flash"
provider = "opencode-go"
effort = "max"
env = ["PATH", "OPENCODE_API_KEY"]

# 役割の期限（usaturn/agent-workspace#616）。PR レビューの全体の予算に合わせて 45 分とし、implement だけ 90 分にする。
# fix-check は呼び出し側（review-verify・review-fix-planning）が 1800 秒に切り詰める。
[roles.inspect]
skills = []
writes = false
deadline_seconds = 2700
result_shape = "json"

[roles.implement]
skills = []
writes = true
deadline_seconds = 5400
result_shape = "json"

[roles.self-review]
skills = []
writes = false
deadline_seconds = 2700
result_shape = "json"

[roles.fix-check]
skills = []
writes = false
deadline_seconds = 2700
result_shape = "json"

[agents.pi-deepseek]
runtime = "pi"
command = ["piccd"]
model = "deepseek/deepseek-v4.1-flash"
provider = "commandcode"
effort = "max"
env = ["HOME", "PATH", "COMMANDCODE_API_KEY"]

[agents.pi-gpt]
runtime = "pi"
command = ["pigs"]
model = "gpt-6.1-sol"
provider = "openai-codex"
effort = "xhigh"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pixg]
runtime = "pi"
command = ["pixg"]
model = "grok-4.7"
provider = "xai"
effort = "xhigh"
env = ["HOME", "PATH"]

[agents.pigod]
runtime = "pi"
command = ["pigod"]
model = "deepseek-v4.1-flash"
provider = "opencode-go"
effort = "max"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pi-go-glmf]
runtime = "pi"
command = ["pi"]
model = "glm-5.3-flash"
provider = "opencode-go"
effort = "max"
env = ["HOME", "PATH", "OPENCODE_API_KEY"]

[agents.pi-gemf]
runtime = "pi"
command = ["pigemf"]
model = "gemini-3.8-flash"
provider = "google-vertex"
effort = "high"
env = ["HOME", "PATH", "GOOGLE_APPLICATION_CREDENTIALS", "GOOGLE_CLOUD_PROJECT", "GCLOUD_PROJECT", "GOOGLE_CLOUD_LOCATION"]

[agents.claude-opus]
runtime = "claude-code"
command = ["claude"]
model = "opus"
env = ["HOME", "PATH"]

[agents.codex]
runtime = "codex"
command = ["codex", "exec"]
model = "gpt-6.1-sol"
provider = "openai"
approval = "noninteractive"
skill_sources = [".agents/skills", ".codex/skills"]
env = ["HOME", "PATH"]

[agents.cursor]
runtime = "cursor"
command = ["agent"]
model = "auto"
approval = "noninteractive"
skill_sources = [".cursor/skills", ".claude/skills", ".agents/skills", ".codex/skills"]
env = ["HOME", "PATH"]

[agents.cursor-grok47]
runtime = "cursor"
command = ["agent"]
model = "grok-4.7-xhigh"
approval = "noninteractive"
skill_sources = [".cursor/skills", ".claude/skills", ".agents/skills", ".codex/skills"]
env = ["HOME", "PATH"]

[agents.devin-swe]
runtime = "devin"
command = ["devin"]
model = "swe-2-max"
env = ["HOME", "PATH"]

# DSH の親入力は caller が起動前に prepare-parent で作る。after_run は事後の保存と観測値の記録だけ。
# 個人設定は書き換えない。after_run = [] で無効にした caller は両コマンドを明示実行する。
[workflows.review]
after_run = [[
  "uv", "run", "--project", ".", "--locked", "python",
  ".agents/skills/pr-review/scripts/review_run.py", "finalize-parent", "--result", "{result}",
], [
  "uv", "run", "--project", ".", "--locked", "python",
  ".agents/skills/pr-review/scripts/review_run.py", "attach-runner", "--result", "{result}",
]]

# 指定が無いときの既定構成。その回の --assign inspect=... または個人設定で選び直せる。
[workflows.review.assignments.inspect]
agents = ["pi-gpt", "devin-swe", "dsh-ccd", "claude-opus"]
