# Dev Container の初回起動時に ~/.dsh/cordis.patch.yml へコピーされる雛形（#282）。
# home レベルの patch 層は各 profile の cordis.patch.yml の後に適用されるため、
# web と headless の両方に効く。
#
# plugin-package-inventory-deepseek は settings.installSection を呼ばず、
# ~/.dsh/settings.yaml の層に参加しない。同じ YAML に並べても無視されるので、
# 無効化は cordis loader の plugin config であるこの patch 層で行う。
# llm-deepseek / llm-commandcode / agent-default-model は settings.yaml 側が正しい。
- id: plugin-package-inventory-deepseek
  config:
    enabled: false
